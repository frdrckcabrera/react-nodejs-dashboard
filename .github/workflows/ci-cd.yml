name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests if present
        run: npm test --workspaces --if-present

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Check backend syntax
        run: find apps/backend/src -name "*.js" -print0 | xargs -0 -n 1 node --check

      - name: Build Docker images
        run: docker compose build

  deployment-smoke-test:
    name: Deployment smoke test
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start deployment stack
        run: docker compose up --build -d

      - name: Wait for backend API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/api/dashboard > /dev/null; then
              exit 0
            fi
            sleep 5
          done

          docker compose logs backend
          exit 1

      - name: Check frontend
        run: curl --fail --silent http://localhost:5173 > /dev/null

      - name: Stop deployment stack
        if: always()
        run: docker compose down --volumes
